services:
  - type: web
    name: helio-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: HOSPITAL_DB_PATH
        value: /opt/render/project/src/backend/hospital.db
