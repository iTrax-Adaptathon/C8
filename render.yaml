services:
  - type: web
    name: helio-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helio-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: helio-db
    databaseName: helio
    user: helio
